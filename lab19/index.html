<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Lineup Guide</title>
    <style>
        body{
            font-family: sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #111;
            color: #eee;
        }
        #status{
            margin: 10px 0;
            font-style: italic;
            color: #9ad;
        }
        #lineup-container{
            display: flex;
            flex-wrap:  wrap;
            gap: 12px;
        }
        #details-panel{
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            min-height: 60px;
        }
        button{
            margin-right: 8px;
            padding: 6px 14px;
            cursor:pointer;        
        }
    </style>
</head>
<body>
    <h1>Festival Lineup Guide</h1>
    <p>Decourverte de la programmatoon du festival</p>
    <button id="load-btn">Load Lineup</button>
    <button id="clear-btn">Clear</button>

    <p id="lineup-container"></p>
    <div id="lineup-container"></div>

    <h2>Details</h2>
    <div id="details-panel">
        <p>Sélectionne un artist pour voir les détails</p>
    </div>
    <!-- Template pour artist-card-->
     <template id="artist-template">
        <style>
            .card {
                border: 1px solid #555;
                border-radius: 8px;
                padding: 10 px;
                width: 200px;
                background: #1c1c1c;         
            }
            .card h3 {
                margin: 0 0 6px 0;
            }
            .card button {
                margin-top: 8px;
            }
        </style>
        <div class="card">
            <h3 class="name">Nom</h3>
            <p class="genre">Genre</p>
            <p class="stage">Scène</p>
            <p class="time">Heure</p>
            <p class="country">Pays</p>
            <button class="details-btn">View Details</button>
        </div>
     </template>
     <script type="module" src="app.js"></script>
</body>
</html>
