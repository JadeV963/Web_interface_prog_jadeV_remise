<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current weather</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="p-4">
    <h1 class="mb-4">Current Weather</h1>
    <div class="mb-5">
        <h2 class="h5">Using your Location</h2>
        <current-weather></current-weather>
    </div>

    <div>
        <h2 class="h5">Manually specified: Tokyo</h2>
        <current-weather latitude="35.6762" longitude="139.6503"></current-weather>
    </div>
    <template id="current-weather-template">
        <style>
        .card {
            border: none;
            border-radius: 1rem;
            padding: 1.5rem;
            max-width: 300px;
            background: linear-gradient(135deg, #4a90e2 0%, #7ec8e3 100%);
            box-shadow: 0 0.5rem 1.5rem rgba(74, 144, 226, 0.35);
            color: #fff;
        }
        .temperature {
            font-size: 3rem;
            font-weight: 800;
            margin: 0.5rem 0;
            color: #ffd93d;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .status {
            color: #fff;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            opacity: 0.9;
        }

        .wind{
            color: #fff;
            font-weight: 500;
            opacity: 0.95;
        }


        </style>
        <div class="card">
            <p class="status">Loading weather ...</p>
            <p class="temperature"></p>
            <p class="wind"></p>
        </div>
    </template>
    <script type="module" src="./js/current-weather.js"></script>
</body>
</html>
