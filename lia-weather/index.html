<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current weather</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="p-4">
    <h1 class="mb-4">Current Weather</h1>
    <div class="mb-5">
        <h2 class="h5">using your Location</h2>
        <current-weather></current-weather>
    </div>

    <div>
        <h2 class="h5">Manually specified: Tokyo</h2>
        <current-weather latitude="35.6762" longitude="139.6503"></current-weather>
    </div>
    <template id="current-weather-template">
        <style>
        .card {
            border: 1px solid #ddd;
            border-radius: 0.5rem;
            padding: 1rem;
            max-width: 280px;
            background: #fff;
        }
        .temperature {
            font-size: 2rem;
            font-weight: bold;
            margin: 0.25rem 0;
        }
        .status {
            color: #666;
            font-size: 0.9rem;
        }
        </style>
        <div class="card">
            <p class="status">Loading weather ...</p>
            <p class="temperature"></p>
            <p class="wind"></p>
        </div>
    </template>
    <script type="module" src="./js/current-weather.js"></script>
</body>
</html>
